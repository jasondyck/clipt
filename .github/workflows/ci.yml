name: ci

# Skipped when every changed file is documentation; the spell check, which
# docs need most, is its own workflow (typos.yml) and always runs. Anything
# else, including data/ (man page, completions) and .github/, runs it all.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  pull_request:
    paths-ignore: ["**.md", "docs/**", "LICENSE-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: .github/scripts/apt-install.sh libxkbcommon-dev fonts-dejavu-core
      - run: cargo test --locked

  msrv:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.89
      - uses: Swatinem/rust-cache@v2
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      - run: cargo check --all-targets --locked

  # Compile for every target we ship or expect distros to build, so libc and
  # platform differences surface in CI rather than in a packager's bug report.
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-gnu
          - riscv64gc-unknown-linux-gnu
          - armv7-unknown-linux-gnueabihf
          - x86_64-unknown-freebsd
          - x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      # Type-check only (no linking), so host pkg-config is fine.
      - run: cargo clippy --locked --target ${{ matrix.target }} -- -D warnings
        env:
          PKG_CONFIG_ALLOW_CROSS: "1"

  # Built and tested on a Mac. The binary is universal (Apple silicon and
  # Intel) and uploaded for testers: signed with the Developer ID and
  # notarised when the repository has the signing secrets (not on pull
  # requests from forks, which get no secrets), ad-hoc signed otherwise.
  macos:
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SIGN: ${{ secrets.MACOS_CERT_P12 != '' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The examples are the Linux end-to-end tests' input driver and window.
      - run: cargo clippy --bins --tests --locked -- -D warnings
      - run: cargo test --locked --bins
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/clipt target/aarch64-apple-darwin/release/clipt target/x86_64-apple-darwin/release/clipt
          # An ad-hoc signature: Apple silicon runs nothing unsigned.
          codesign --force --sign - dist/clipt
          packaging/macos/build-app.sh dist/clipt dist
      - name: sign and notarise
        if: env.SIGN == 'true'
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: .github/scripts/macos-sign.sh dist/clipt dist/clipt.app
      - run: |
          codesign --display --verbose=2 dist/clipt 2>&1 | grep -E "^(Authority|TeamIdentifier|Signature)" || true
          dist/clipt --version
          dist/clipt list
      # Whether the runner lets it record the screen varies; the PNG, when
      # there is one, shows the capture works end to end.
      - name: capture
        continue-on-error: true
        run: |
          dist/clipt full -o dist/full.png
          file dist/full.png
      # Zipped with ditto: an artifact upload drops the executable bit, and
      # with it the app.
      - run: |
          ditto -c -k --keepParent dist/clipt.app dist/clipt-app.zip
          rm -rf dist/clipt.app
      - uses: actions/upload-artifact@v7
        with:
          name: clipt-macos
          path: dist/

  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The examples are the Linux end-to-end tests' input driver and window.
      - run: cargo clippy --bins --tests --locked -- -D warnings
      - run: cargo test --locked --bins
      - run: cargo build --release --locked
      # The runner has a desktop session, so GDI can capture it.
      - shell: bash
        run: |
          mkdir -p dist
          cp target/release/clipt.exe dist/
          dist/clipt.exe --version
          dist/clipt.exe list
          dist/clipt.exe full -o dist/full.png
          file dist/full.png
      # Packed as the release workflow's windows job packs it, so a broken
      # step shows up here rather than halfway through a release.
      - name: pack as a release would
        shell: bash
        run: |
          name="clipt-vci-x86_64-windows"
          mkdir -p "$name"
          cp target/release/clipt.exe README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          "$name/clipt.exe" --version
          7z a "$name.zip" "$name" >/dev/null
          sha256sum "$name.zip" > "$name.zip.sha256"
          cat "$name.zip.sha256"
          7z l "$name.zip" | tail -3
      - uses: actions/upload-artifact@v7
        with:
          name: clipt-windows
          path: dist/

  nix:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: cachix/install-nix-action@v31
      # Without the check phase, which compiled everything again to run the
      # tests the test job already runs (more than two minutes). `nix build
      # .#clipt` for users still runs them.
      - run: |
          nix build -L --impure --expr \
            '(builtins.getFlake (toString ./.)).packages.${builtins.currentSystem}.clipt.overrideAttrs { doCheck = false; }'
      - run: ./result/bin/clipt --version

  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # Real compositors in containers, driven by scripted input; every capture is
  # checked against grim or the expected native size.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { image: sway, layout: single }
          - { image: sway, layout: sound }
          - { image: sway, layout: frac }
          - { image: sway, layout: dual }
          - { image: sway, layout: triple }
          - { image: gnome, layout: single }
          - { image: gnome, layout: dual }
          - { image: x11, layout: single }
          - { image: x11, layout: multi }
          - { image: compositors, layout: labwc }
          - { image: compositors, layout: niri }
    name: e2e (${{ matrix.suite.image }} ${{ matrix.suite.layout }})
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      - run: cargo build --profile ci --locked --bin clipt --example vinput --example testwin --example x11grab
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: tests/${{ matrix.suite.image }}
          tags: clipt-${{ matrix.suite.image }}
          load: true
          cache-from: type=gha,scope=${{ matrix.suite.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suite.image }}
      - name: run
        run: tests/e2e.sh --no-build ${{ matrix.suite.image }} ${{ matrix.suite.layout }}
        env:
          CLIPT_PROFILE: ci
