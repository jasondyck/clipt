name: release

# Two ways to release:
#   * Actions → release → Run workflow, enter a version (or
#     `gh workflow run release -f version=0.2.0`): tests, bumps Cargo.toml,
#     dates the CHANGELOG, commits, tags and releases.
#   * Push a tag like v0.2.0 yourself, after bumping by hand.
# Either way: x86_64 and aarch64 tarballs, .deb and .rpm, a universal macOS
# tarball (signed and notarised, with the secrets docs/macos-plan.md lists),
# a Windows zip,
# a published GitHub release (prerelease for tags like v0.2.0-rc1) with that
# version's CHANGELOG section as notes, and crates.io when a
# CARGO_REGISTRY_TOKEN is configured.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.2.0 or 0.2.0-rc1"
        required: true

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      - name: bump (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::tag v$VERSION already exists"; exit 1
          fi
          python3 .github/scripts/prepare-release.py "$VERSION"
          cargo update --workspace
      - name: verify version matches tag
        run: |
          v="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          python3 .github/scripts/prepare-release.py --verify "${v#v}"
      # The gate: nothing is tagged or published unless this passes.
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: commit and tag (manual run)
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Release v$VERSION"
          git tag -a "v$VERSION" -m "clipt $VERSION"
          git push origin "HEAD:${{ github.ref_name }}" "v$VERSION"
      - id: tag
        run: |
          v="${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}"
          echo "tag=v${v#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      # Built on the oldest supported Ubuntu so the glibc requirement stays low.
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: deb and rpm
        run: |
          cargo deb --no-build -o .
          cargo generate-rpm -o .
      - name: pack
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="clipt-${TAG}-${{ matrix.arch }}-linux"
          mkdir -p "$name"
          cp target/release/clipt data/clipt.desktop data/clipt-tray.desktop data/clipt.svg data/clipt.1 install.sh README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          cp data/completions/clipt.bash data/completions/_clipt data/completions/clipt.fish "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.arch }}
          path: |
            clipt-*.tar.gz*
            clipt*.deb
            clipt*.rpm

  # One universal binary (Apple silicon and Intel), signed with the
  # Developer ID and notarised, as the macos CI job builds it. No install.sh:
  # it's for Linux desktops.
  macos:
    needs: prepare
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/clipt target/aarch64-apple-darwin/release/clipt target/x86_64-apple-darwin/release/clipt
          codesign --force --sign - dist/clipt
          packaging/macos/build-app.sh dist/clipt dist
      - name: sign and notarise
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "::error::no macOS signing secrets"; exit 1; fi
          .github/scripts/macos-sign.sh --wait 30m dist/clipt dist/clipt.app
      - run: dist/clipt --version
      - name: pack
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          name="clipt-${TAG}-universal-macos"
          mkdir -p "$name"
          cp dist/clipt data/clipt.1 README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          cp data/completions/clipt.bash data/completions/_clipt data/completions/clipt.fish "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
          app="clipt-${TAG}-macos-app.zip"
          ditto -c -k --keepParent dist/clipt.app "$app"
          shasum -a 256 "$app" > "$app.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: |
            clipt-*.tar.gz*
            clipt-*-macos-app.zip*

  # clipt.exe in a zip, unsigned (Windows warns before the first run; see
  # docs/windows-plan.md).
  windows:
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      # prepare's gate runs on Linux; this one covers the Windows-only code.
      - run: cargo clippy --bins --tests --locked -- -D warnings
      - run: cargo test --locked --bins
      - run: cargo build --release --locked
      - name: pack
        shell: bash
        run: .github/scripts/pack-windows.sh "${{ needs.prepare.outputs.tag }}"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: clipt-*-windows.zip*

  release:
    needs: [prepare, build, macos, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: notes and checksums
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          v=${TAG#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          sha256sum clipt-*.tar.gz clipt-*-macos-app.zip clipt-*-windows.zip clipt*.deb clipt*.rpm > SHA256SUMS
          case "$TAG" in *-*) echo "PRERELEASE=true" >> "$GITHUB_ENV" ;; *) echo "PRERELEASE=false" >> "$GITHUB_ENV" ;; esac
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: clipt ${{ needs.prepare.outputs.tag }}
          body_path: notes.md
          prerelease: ${{ env.PRERELEASE }}
          files: |
            clipt-*.tar.gz*
            clipt-*-macos-app.zip*
            clipt-*-windows.zip*
            clipt*.deb
            clipt*.rpm
            SHA256SUMS

  # The repository is its own Scoop bucket (bucket/clipt.json): point it at
  # the new zip. Prereleases stay out, as they do for `clipt update`.
  scoop:
    needs: [prepare, release]
    if: ${{ !contains(needs.prepare.outputs.tag, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # The branch the release commit went to; for a pushed tag, the default.
      BRANCH: ${{ github.event_name == 'workflow_dispatch' && github.ref_name || github.event.repository.default_branch }}
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
      - uses: actions/download-artifact@v8
        with:
          name: windows
      - name: update and push the manifest
        run: |
          set -eu
          sha=$(cut -d' ' -f1 "clipt-$TAG-x86_64-windows.zip.sha256")
          .github/scripts/scoop-manifest.py "${TAG#v}" "$sha"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/clipt.json
          # Already there (a re-run): nothing to commit, nothing to push.
          if git diff --cached --quiet; then echo "bucket already at ${TAG#v}"; exit 0; fi
          git commit -m "Scoop: clipt ${TAG#v}"
          for i in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1

  # Publishes to crates.io when a CARGO_REGISTRY_TOKEN secret is configured.
  crates-io:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
      - run: .github/scripts/apt-install.sh libxkbcommon-dev
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "no CARGO_REGISTRY_TOKEN secret; skipping"; exit 0; fi
          cargo publish --locked
