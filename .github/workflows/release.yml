name: release

# Push a tag like v0.2.0: builds x86_64 and aarch64 tarballs, .deb and .rpm
# packages, drafts a GitHub release whose notes are that version's CHANGELOG
# section, and publishes to crates.io if a token is configured.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { runner: ubuntu-22.04, arch: x86_64 }
          - { runner: ubuntu-22.04-arm, arch: aarch64 }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Built on the oldest supported Ubuntu so the glibc requirement stays low.
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - run: cargo build --release --locked
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: deb and rpm
        run: |
          cargo deb --no-build -o .
          cargo generate-rpm -o .
      - name: pack
        run: |
          name="clipt-${GITHUB_REF_NAME}-${{ matrix.arch }}-linux"
          mkdir -p "$name"
          cp target/release/clipt data/clipt.desktop install.sh README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "$name/"
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.arch }}
          path: |
            clipt-*.tar.gz*
            clipt*.deb
            clipt*.rpm

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: notes from CHANGELOG
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: notes.md
          files: |
            clipt-*.tar.gz*
            clipt*.deb
            clipt*.rpm

  # Publishes to crates.io when a CARGO_REGISTRY_TOKEN secret is configured.
  crates-io:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then echo "no CARGO_REGISTRY_TOKEN secret; skipping"; exit 0; fi
          cargo publish --locked
