# Headless Xorg with the dummy driver: real RandR 1.5, so `xrandr
# --setmonitor` can describe a multi-monitor layout for the tests.
Section "Device"
    Identifier "dummy"
    Driver "dummy"
    VideoRam 512000
EndSection
Section "Monitor"
    Identifier "monitor"
    HorizSync 5.0 - 1000.0
    VertRefresh 5.0 - 200.0
    Modeline "4480x2464" 900.00 4480 4488 4520 4560 2464 2467 2477 2480
EndSection
Section "Screen"
    Identifier "screen"
    Device "dummy"
    Monitor "monitor"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "4480x2464"
        Virtual 4480 2464
    EndSubSection
EndSection
Section "ServerFlags"
    Option "AutoAddDevices" "false"
EndSection
