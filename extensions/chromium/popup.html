<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { width: 230px; margin: 0; padding: 12px; font: 13px system-ui, sans-serif; color: #1c1c1e; }
  h1 { font-size: 14px; margin: 0 0 10px; }
  button {
    display: block; width: 100%; margin: 0 0 6px; padding: 8px 10px; border: 0; border-radius: 8px;
    font: inherit; text-align: left; cursor: pointer; background: #f1f1f4;
  }
  button.primary { background: #3b82f6; color: white; }
  button:disabled { opacity: 0.6; cursor: default; }
  .key { float: right; opacity: 0.7; font-size: 11px; }
  #status { min-height: 1.2em; margin-top: 6px; color: #555; }
  #status.error { color: #b91c1c; }
</style>
</head>
<body>
  <h1>Full-page screenshot</h1>
  <button id="copy" class="primary">Copy <span class="key" id="copy-key"></span></button>
  <button id="save">Save</button>
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
