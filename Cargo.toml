[package]
name = "glint"
version = "0.1.0"
edition = "2024"
description = "Lightweight Wayland screenshot tool with region select and annotation"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
anyhow = "1"
lexopt = "0.3"
libc = "0.2.191"
memmap2 = "0.9"
png = "0.18"
rustix = { version = "1", features = ["fs", "pipe", "process", "shm", "time"] }
serde = { version = "1", features = ["derive"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = { version = "0.9", default-features = false, features = ["parse", "serde", "std"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# `cargo build --profile profiling` for perf: release speed, with symbols.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"
