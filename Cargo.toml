[package]
name = "clipt"
version = "0.8.0"
edition = "2024"
description = "Fast, lightweight screenshot and screen-recording tool for Wayland and X11"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jasondyck/clipt"
readme = "README.md"
keywords = ["screenshot", "wayland", "annotation", "flameshot", "capture"]
categories = ["command-line-utilities", "multimedia::images"]
rust-version = "1.89"
exclude = ["/tests", "/.github", "/docs", "/packaging", "/flake.nix", "/flake.lock"]

[features]
default = ["pipewire"]
# Recording on KDE and GNOME: frames come over PipeWire (libpipewire is
# loaded at runtime, not linked) and KDE's screencast protocol.
pipewire = ["dep:wayland-protocols-plasma"]

[dependencies]
anyhow = "1"
lexopt = "0.3"
libc = "0.2.191"
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.49"
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }

# The Wayland and X11 desktops: every Unix but macOS (Linux, the BSDs).
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
futures-core = { version = "0.3", default-features = false }
memmap2 = "0.9"
rustix = { version = "1", features = ["fs", "pipe", "process", "shm", "time"] }
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.14", default-features = false, features = ["damage", "randr", "shm", "xfixes", "xinerama", "xtest"] }
xkeysym = "0.2"
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }

# macOS: bindings to the system frameworks (AppKit, Core Graphics), which
# every Mac has.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "std", "NSApplication", "NSBitmapImageRep", "NSButton", "NSCell", "NSColor", "NSControl", "NSCursor", "NSEvent", "NSGraphics",
    "NSImage", "NSImageRep", "NSMenu", "NSMenuItem", "NSPasteboard", "NSResponder", "NSRunningApplication", "NSScreen",
    "NSStatusBar", "NSStatusBarButton", "NSStatusItem", "NSView", "NSWindow", "objc2-core-foundation",
    "objc2-quartz-core",
] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFCGTypes", "CFData", "CFDictionary", "CFNumber", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = [
    "std", "CGBitmapContext", "CGColorSpace", "CGContext", "CGDataProvider", "CGDirectDisplay", "CGError", "CGGeometry",
    "CGImage", "CGWindow", "objc2",
] }
objc2-io-surface = { version = "0.3", default-features = false, features = ["std", "IOSurfaceRef", "IOSurfaceTypes", "libc", "objc2", "objc2-core-foundation"] }
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "std", "NSArray", "NSBundle", "NSData", "NSDate", "NSDictionary", "NSEnumerator", "NSError", "NSGeometry", "NSObjCRuntime", "NSRunLoop", "NSString", "NSValue",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = ["std", "CALayer", "CATransaction", "objc2-core-foundation"] }

# Windows: Microsoft's raw Win32 bindings, calling DLLs every Windows has.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Console",
    "Win32_System_DataExchange", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Ole", "Win32_System_Performance", "Win32_System_Pipes",
    "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

# For examples/vinput.rs and testwin.rs, the Linux end-to-end tests' input
# driver and test window (x11grab.rs needs only x11rb).
[target.'cfg(all(unix, not(target_os = "macos")))'.dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# CI's end-to-end builds: release speed without the fat LTO and single
# codegen unit, which take most of a release build's time.
[profile.ci]
inherits = "release"
lto = false
codegen-units = 16

# `cargo build --profile profiling` for perf: release speed, with symbols.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[package.metadata.deb]
maintainer = "The clipt contributors"
section = "graphics"
extended-description = """\
Freeze the screen, drag a region, annotate it (arrows, boxes, text, \
pixelate, counters), then copy or save. Works on KDE, GNOME, wlroots \
compositors (Sway, Hyprland, niri, ...) and X11, with correct handling of \
multiple monitors at different resolutions and scales. Also records the \
screen, a region or a window to MP4 or GIF (with ffmpeg)."""
# Explicit so a missing dpkg-shlibdeps can never produce an empty list.
depends = "libc6 (>= 2.35), libxkbcommon0"
# Recording: ffmpeg encodes; libpipewire (loaded when needed) on KDE and GNOME.
recommends = "ffmpeg, libpipewire-0.3-0t64 | libpipewire-0.3-0"
assets = [
    ["target/release/clipt", "usr/bin/", "755"],
    ["data/clipt.desktop", "usr/share/applications/", "644"],
    ["data/clipt.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/clipt.1", "usr/share/man/man1/", "644"],
    ["data/completions/clipt.bash", "usr/share/bash-completion/completions/clipt", "644"],
    ["data/completions/_clipt", "usr/share/zsh/vendor-completions/", "644"],
    ["data/completions/clipt.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/clipt/", "644"],
    ["CHANGELOG.md", "usr/share/doc/clipt/", "644"],
    ["LICENSE-MIT", "usr/share/doc/clipt/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/clipt/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/clipt", dest = "/usr/bin/clipt", mode = "755" },
    { source = "data/clipt.desktop", dest = "/usr/share/applications/clipt.desktop", mode = "644" },
    { source = "data/clipt.svg", dest = "/usr/share/icons/hicolor/scalable/apps/clipt.svg", mode = "644" },
    { source = "data/clipt.1", dest = "/usr/share/man/man1/clipt.1", mode = "644", doc = true },
    { source = "data/completions/clipt.bash", dest = "/usr/share/bash-completion/completions/clipt", mode = "644" },
    { source = "data/completions/_clipt", dest = "/usr/share/zsh/site-functions/_clipt", mode = "644" },
    { source = "data/completions/clipt.fish", dest = "/usr/share/fish/vendor_completions.d/clipt.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/clipt/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/clipt/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/clipt/LICENSE-APACHE", mode = "644", doc = true },
]
[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
[package.metadata.generate-rpm.recommends]
ffmpeg = "*"
pipewire-libs = "*"
