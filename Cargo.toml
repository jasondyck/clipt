[package]
name = "clipt"
version = "0.1.1"
edition = "2024"
description = "Fast, lightweight screenshot tool for Wayland and X11 with region select and annotation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/jasondyck/clipt"
readme = "README.md"
keywords = ["screenshot", "wayland", "annotation", "flameshot", "capture"]
categories = ["command-line-utilities", "multimedia::images"]
rust-version = "1.89"
exclude = ["/tests", "/.github", "/docs", "/packaging", "/flake.nix", "/flake.lock"]

[features]
default = ["pipewire"]
# Recording on KDE and GNOME: frames come over PipeWire (libpipewire is
# loaded at runtime, not linked) and KDE's screencast protocol.
pipewire = ["dep:wayland-protocols-plasma"]

[dependencies]
anyhow = "1"
futures-core = { version = "0.3", default-features = false }
lexopt = "0.3"
libc = "0.2.191"
memmap2 = "0.9"
png = "0.18"
rustix = { version = "1", features = ["fs", "pipe", "process", "shm", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.49"
smithay-client-toolkit = { version = "0.21", default-features = false, features = ["calloop", "xkbcommon"] }
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "std"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wayland-protocols-plasma = { version = "0.3", features = ["client"], optional = true }
x11rb = { version = "0.14", default-features = false, features = ["damage", "randr", "shm", "xfixes", "xinerama"] }
xkeysym = "0.2"
zbus = { version = "6", default-features = false, features = ["default-rt", "proxy", "service"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
opt-level = 3

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }

# `cargo build --profile profiling` for perf: release speed, with symbols.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[package.metadata.deb]
maintainer = "The clipt contributors"
section = "graphics"
extended-description = """\
Freeze the screen, drag a region, annotate it (arrows, boxes, text, \
pixelate, counters), then copy or save. Works on KDE, GNOME, wlroots \
compositors (Sway, Hyprland, niri, ...) and X11, with correct handling of \
multiple monitors at different resolutions and scales."""
# Explicit so a missing dpkg-shlibdeps can never produce an empty list.
depends = "libc6 (>= 2.35), libxkbcommon0"
# Recording: ffmpeg encodes; libpipewire (loaded when needed) on KDE and GNOME.
recommends = "ffmpeg, libpipewire-0.3-0t64 | libpipewire-0.3-0"
assets = [
    ["target/release/clipt", "usr/bin/", "755"],
    ["data/clipt.desktop", "usr/share/applications/", "644"],
    ["data/clipt.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["data/clipt.1", "usr/share/man/man1/", "644"],
    ["data/completions/clipt.bash", "usr/share/bash-completion/completions/clipt", "644"],
    ["data/completions/_clipt", "usr/share/zsh/vendor-completions/", "644"],
    ["data/completions/clipt.fish", "usr/share/fish/vendor_completions.d/", "644"],
    ["README.md", "usr/share/doc/clipt/", "644"],
    ["CHANGELOG.md", "usr/share/doc/clipt/", "644"],
    ["LICENSE-MIT", "usr/share/doc/clipt/", "644"],
    ["LICENSE-APACHE", "usr/share/doc/clipt/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/clipt", dest = "/usr/bin/clipt", mode = "755" },
    { source = "data/clipt.desktop", dest = "/usr/share/applications/clipt.desktop", mode = "644" },
    { source = "data/clipt.svg", dest = "/usr/share/icons/hicolor/scalable/apps/clipt.svg", mode = "644" },
    { source = "data/clipt.1", dest = "/usr/share/man/man1/clipt.1", mode = "644", doc = true },
    { source = "data/completions/clipt.bash", dest = "/usr/share/bash-completion/completions/clipt", mode = "644" },
    { source = "data/completions/_clipt", dest = "/usr/share/zsh/site-functions/_clipt", mode = "644" },
    { source = "data/completions/clipt.fish", dest = "/usr/share/fish/vendor_completions.d/clipt.fish", mode = "644" },
    { source = "README.md", dest = "/usr/share/doc/clipt/README.md", mode = "644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/clipt/LICENSE-MIT", mode = "644", doc = true },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/clipt/LICENSE-APACHE", mode = "644", doc = true },
]
[package.metadata.generate-rpm.requires]
libxkbcommon = "*"
[package.metadata.generate-rpm.recommends]
ffmpeg = "*"
pipewire-libs = "*"
