# Flatpak manifest (prototype). Build and install locally from the repo root:
#   packaging/flatpak/build.sh
# After changing Cargo.lock, regenerate the vendored crate list:
#   packaging/flatpak/cargo-sources.py
id: io.github.jasondyck.clipt
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: clipt
finish-args:
  - --socket=wayland
  # Use a Wayland connection the launcher opened (WAYLAND_SOCKET) instead of
  # Flatpak's filtered one. Grants nothing by itself; with clipt-launch it
  # gives back screencopy and layer-shell on wlroots and niri.
  - --socket=inherit-wayland-socket
  - --socket=fallback-x11
  # MIT-SHM for the X11 overlay.
  - --share=ipc
  # save_dir defaults to ~/Pictures/Screenshots.
  - --filesystem=xdg-pictures
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  # KDE: ScreenShot2 for capture and a KWin script for window positions.
  # Sandboxed callers may be refused; the build exists partly to find out.
  - --talk-name=org.kde.KWin
  - --talk-name=org.kde.KWin.ScreenShot2
  # Hyprland's IPC socket, for window positions.
  - --filesystem=xdg-run/hypr
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/clipt/cargo
modules:
  - name: clipt
    buildsystem: simple
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/clipt /app/bin/clipt
      # Flatpak only exports files named after the app ID.
      - sed "s/^Icon=clipt$/Icon=${FLATPAK_ID}/" data/clipt.desktop > ${FLATPAK_ID}.desktop
      - install -Dm644 ${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 data/clipt.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm644 packaging/flatpak/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
    sources:
      - type: dir
        path: ../..
        skip:
          - target
          - .git
          - .flatpak-builder
          - packaging/flatpak/build
          - packaging/flatpak/repo
          - packaging/flatpak/clipt.flatpak
      - cargo-sources.json
